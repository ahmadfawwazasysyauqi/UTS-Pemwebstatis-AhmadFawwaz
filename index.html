<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTS Web Statis - Ahmad Fawwaz</title>
    <style>
        /* CSS GABUNGAN - Anti Gagal Upload Folder */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #ffffff; color: #333333; }

        .split-layout { display: flex; flex-direction: column-reverse; min-height: 100vh; width: 100%; }
        /* Jika gambar gagal diload internet, background warna gradasi otomatis menggantikan */
        .illustration-col { display: none; width: 100%; background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); }
        .form-col { width: 100%; display: flex; justify-content: center; align-items: center; padding: 2rem 1.5rem; }
        .form-container { width: 100%; max-width: 420px; }

        .form-header h1 { font-size: 1.8rem; font-weight: 700; color: #111827; margin-bottom: 0.5rem; }
        .form-header p { color: #6b7280; margin-bottom: 2rem; font-size: 0.95rem; }

        .btn-sso { display: flex; align-items: center; justify-content: center; width: 100%; padding: 0.75rem; background-color: #ffffff; border: 1px solid #d1d5db; border-radius: 0.5rem; font-size: 1rem; font-weight: 600; color: #374151; cursor: pointer; gap: 0.75rem; transition: background-color 0.2s ease; }
        .btn-sso:hover { background-color: #f3f4f6; }

        .divider { display: flex; align-items: center; text-align: center; margin: 1.5rem 0; color: #9ca3af; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #e5e7eb; }
        .divider span { padding: 0 1rem; font-size: 0.875rem; }

        .form-group { margin-bottom: 1.25rem; display: flex; flex-direction: column; }
        .form-group label { font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem; color: #374151; }
        .form-group input { padding: 0.75rem 1rem; border: 1px solid #d1d5db; border-radius: 0.5rem; font-size: 1rem; transition: all 0.2s ease; }
        .form-group input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2); }

        .form-options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .remember-me { display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; color: #4b5563; cursor: pointer; }
        .forgot-password { font-size: 0.875rem; color: #2563eb; text-decoration: none; font-weight: 600; }
        .forgot-password:hover { text-decoration: underline; }

        .btn-primary { width: 100%; padding: 0.875rem; background-color: #2563eb; color: #ffffff; border: none; border-radius: 0.5rem; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background-color 0.2s ease; }
        .btn-primary:hover { background-color: #1d4ed8; }

        @media (min-width: 768px) {
            .split-layout { flex-direction: row; height: 100vh; }
            .illustration-col { display: block; flex: 1.2; height: 100vh; position: relative; overflow: hidden; }
            .illustration-col img { width: 100%; height: 100%; object-fit: cover; }
            .form-col { flex: 1; height: 100vh; padding: 4rem 2rem; overflow-y: auto; }
            .form-container { max-width: 420px; }
        }
    </style>
</head>
<body>
    <main class="split-layout">
        
        <!-- Kolom Kiri: URL Gambar dari Wikimedia Commons (Server yang tidak pernah diblokir ISP Indonesia) -->
        <section class="illustration-col" aria-label="Branding Artwork">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Abstract_geometric_background.jpg/800px-Abstract_geometric_background.jpg" alt="Artistic Branding Background" onerror="this.style.display='none'">
        </section>

        <!-- Kolom Kanan: Formulir Login -->
        <section class="form-col" aria-label="Login Form Section">
            <div class="form-container">
                
                <!-- Logo Perusahaan (Ikon berbasis kode SVG. Dijamin 100% muncul) -->
                <div class="logo" style="display: flex; align-items: center; margin-bottom: 2rem;">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="35px" height="35px" fill="#2563eb"><path d="M256 0c-2.4 0-4.7 .7-6.6 2L3.1 175.5C1.1 176.9 0 179.3 0 181.8V288c0 106.6 69.5 198.8 168.1 230.1c4.5 1.4 9.4 1.4 14 0C280.7 486.8 350.2 394.6 350.2 288V181.8c0-2.5-1.1-4.9-3.1-6.3L100.8 2C98.8 .7 96.5 0 94.1 0H256zM508.9 175.5L262.6 2c-1.9-1.3-4.2-2-6.6-2H256V511.9c13.7-4.3 26.8-10.2 39.1-17.8C424.8 415.8 512 305.6 512 288V181.8c0-2.5-1.1-4.9-3.1-6.3z"/></svg>
                    <h2 style="margin-left: 10px; margin-bottom: 0; color: #2563eb;">BrandKu.</h2>
                </div>
                
                <div class="form-header">
                    <h1>Welcome Back</h1>
                    <p>Silakan masuk ke akun Anda untuk melanjutkan.</p>
                </div>

                <form action="#" method="POST">
                    <!-- Tombol SSO Google (Ikon berbasis kode SVG. Dijamin 100% muncul) -->
                    <button type="button" class="btn-sso" aria-label="Sign in with Google account">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="20px" height="20px"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg>
                        Sign in with Google
                    </button>

                    <div class="divider">
                        <span>or</span>
                    </div>

                    <div class="form-group">
                        <label for="username">Email/Username</label>
                        <input type="text" id="username" name="username" required placeholder="Masukkan email atau username">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required placeholder="••••••••">
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" name="remember"> Remember Me
                        </label>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-primary">Sign In</button>
                </form>
            </div>
        </section>

    </main>
</body>
</html>
